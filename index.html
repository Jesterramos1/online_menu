<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e9">
<title>Muna Bistro Café — Menu</title>
<meta name="description" content="Because you deserve a pause. View our full menu, weekly specials, and drinks.">

<!-- Open Graph / Messenger, Facebook, iMessage link previews -->
<meta property="og:type" content="website">
<meta property="og:title" content="Muna Bistro Café — Menu">
<meta property="og:description" content="Because you deserve a pause. View our full menu, weekly specials, and drinks.">
<meta property="og:image" content="https://menu.munabistrocafe.online/og-image.jpg">
<meta property="og:url" content="https://menu.munabistrocafe.online/">
<meta property="og:site_name" content="Muna Bistro Café">

<!-- Twitter/X card (harmless to include, some apps fall back to it) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Muna Bistro Café — Menu">
<meta name="twitter:description" content="Because you deserve a pause. View our full menu, weekly specials, and drinks.">
<meta name="twitter:image" content="https://menu.munabistrocafe.online/og-image.jpg">

<!--
  ============================================================================
  DIGITAL MENU VIEWER — single-file, static, no backend
  ============================================================================
  HOW TO CUSTOMIZE
  -----------------
  Everything you need to change lives in the CONFIG object inside the
  <script> block near the bottom (search for "CONFIG = {"):
    - pdfUrl        → path or URL to your menu PDF
    - title/subtitle→ shown on the brand bar
    - logoUrl       → optional logo image (leave "" to hide)
    - accent / ink / paper colors → CSS custom properties, edit in :root below

  No build step, no dependencies to install — just edit and open in a browser
  (or upload the file + your PDF to any static host).
  ============================================================================
-->

<style>
  /* ===========================================================================
     DESIGN TOKENS
     A quiet, daylight café palette: warm paper background, brushed-brass
     accent, and a crisp white stage that lets the menu itself be the hero.
     =========================================================================== */
  :root{
    --bg:             #f7f2e9;   /* room background, warm paper           */
    --bg-2:           #efe7d6;   /* raised surfaces (bars, buttons)       */
    --bg-3:           #e4d8bf;   /* hover/active surfaces                 */
    --paper:          #ffffff;   /* the page stage backdrop               */
    --brass:          #c9a961;   /* decorative accent — brushed brass     */
    --brass-deep:     #96742f;   /* accent used for text/icons (AA-safe)  */
    --ink:            #2a1f16;   /* primary text, espresso brown          */
    --ink-dim:        #7a6a56;   /* secondary text                        */
    --shadow-ambient: 0 24px 60px -20px rgba(42,31,22,0.22);
    --shadow-soft:    0 8px 20px -8px rgba(42,31,22,0.16);
    --radius-lg:      20px;
    --radius-md:      12px;
    --ease:           cubic-bezier(.22,.61,.36,1);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color:var(--ink);
  }
  @font-face{
    font-family:'Fraunces';
    src:local('Fraunces');
  }

  #app{
    position:relative; width:100vw; height:100vh; height:100dvh;
    display:flex; flex-direction:column; overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, #fffdf8 0%, var(--bg) 55%),
      var(--bg);
  }

  /* ---------------------------------------------------------------------
     BRAND BAR (top) — auto-hides with the rest of the chrome
     --------------------------------------------------------------------- */
  #brandBar{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:22px 20px 40px;
    background:linear-gradient(to bottom, rgba(247,242,233,0.92) 0%, rgba(247,242,233,0) 100%);
    pointer-events:none;
    transition:opacity .5s var(--ease), transform .5s var(--ease);
  }
  #brandBar img{ height:30px; width:auto; opacity:.95; }
  #brandBar .titles{ text-align:center; line-height:1.15; }
  #brandBar .titles .t{
    font-family:'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight:600; font-size:19px; letter-spacing:.02em; color:var(--ink);
  }
  #brandBar .titles .s{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--brass-deep); margin-top:2px;
  }

  /* ---------------------------------------------------------------------
     STAGE — where the current page lives
     --------------------------------------------------------------------- */
  #viewer{
    flex:1; position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    padding: clamp(14px, 4vh, 56px) clamp(14px, 6vw, 90px);
    overflow:hidden;
  }

  #pageStage{
    position:relative;
    width:100%; height:100%;
    max-width:900px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    touch-action:pan-y;
  }

  .page-layer{
    position:absolute;
    max-width:100%; max-height:100%;
    width:auto; height:auto;
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-ambient), 0 0 0 1px rgba(42,31,22,0.07);
    background:var(--paper);
    opacity:0;
    transform:scale(.985) translateY(6px);
    transition:opacity .38s var(--ease), transform .38s var(--ease);
    will-change:opacity, transform;
    user-select:none;
    -webkit-user-drag:none;
  }
  .page-layer.active{
    opacity:1;
    transform:scale(1) translateY(0);
    z-index:2;
  }
  .page-layer.zoomed{ transform:scale(var(--zoom, 1)); }
  .page-layer.active.zoomed{ z-index:2; }

  /* subtle affordance for the "previous page" click/tap zone */
  #pageStage::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0; width:30%;
    z-index:5; pointer-events:none;
    opacity:0;
    background:linear-gradient(to right, rgba(0,0,0,0.18), transparent);
    transition:opacity .25s ease;
  }
  #pageStage.hint-left::before{ opacity:1; }

  /* ---------------------------------------------------------------------
     LOADING SCREEN
     --------------------------------------------------------------------- */
  #loadingScreen{
    position:absolute; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    background:var(--bg);
    transition:opacity .6s var(--ease), visibility .6s;
  }
  #loadingScreen.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:2px solid rgba(150,116,47,0.18);
    border-top-color:var(--brass-deep);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loadingScreen .label{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim); }
  #loadingScreen .brand-name{
    font-family:'Fraunces', Georgia, serif; font-size:24px; color:var(--ink); letter-spacing:.02em;
  }

  #errorScreen{
    position:absolute; inset:0; z-index:100;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:40px; background:var(--bg);
  }
  #errorScreen.show{ display:flex; }
  #errorScreen h2{ font-family:'Fraunces', serif; font-weight:600; margin:0; color:var(--ink); }
  #errorScreen p{ color:var(--ink-dim); font-size:14px; max-width:360px; margin:0; }
  #errorRetryBtn{
    appearance:none; border:1px solid rgba(150,116,47,0.35); background:var(--paper);
    color:var(--brass-deep); font-size:13px; font-weight:600; letter-spacing:.02em;
    padding:10px 22px; border-radius:999px; cursor:pointer; margin-top:6px;
    box-shadow:var(--shadow-soft); transition:background .2s ease, transform .15s ease;
  }
  #errorRetryBtn:hover{ background:var(--bg-2); }
  #errorRetryBtn:active{ transform:scale(.96); }

  /* ---------------------------------------------------------------------
     CONTROLS (bottom bar) — the only UI chrome, auto-hides on idle
     --------------------------------------------------------------------- */
  #controls{
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    padding:26px 16px 22px;
    background:linear-gradient(to top, rgba(247,242,233,0.94) 0%, rgba(247,242,233,0) 100%);
    transition:opacity .5s var(--ease), transform .5s var(--ease);
  }
  #controlsBar{
    display:flex; align-items:center; gap:4px;
    background:rgba(255,255,255,0.78);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(150,116,47,0.22);
    border-radius:999px;
    padding:6px;
    box-shadow:var(--shadow-soft);
  }
  #controlsBar button{
    appearance:none; border:none; background:transparent; color:var(--ink);
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; text-decoration:none;
    transition:background .2s ease, color .2s ease, transform .15s ease;
  }
  #controlsBar button:hover{ background:var(--bg-3); color:var(--brass-deep); }
  #controlsBar button:active{ transform:scale(.9); }
  #controlsBar button:disabled{ opacity:.3; cursor:default; }
  #controlsBar button:disabled:hover{ background:transparent; color:var(--ink); }
  #controlsBar button svg{ width:17px; height:17px; }

  #pageIndicator{
    min-width:64px; text-align:center;
    font-size:12.5px; font-variant-numeric:tabular-nums;
    letter-spacing:.03em; color:var(--ink-dim);
    padding:0 6px; user-select:none;
  }
  #pageIndicator b{ color:var(--ink); font-weight:600; }

  #zoomLabel{
    min-width:38px; text-align:center; font-size:11px; color:var(--ink-dim);
    font-variant-numeric:tabular-nums; user-select:none;
  }

  .ctrl-divider{ width:1px; height:22px; background:rgba(42,31,22,0.12); margin:0 4px; }

  /* Hidden (idle) state for chrome */
  .chrome-hidden #brandBar{ opacity:0; transform:translateY(-8px); }
  .chrome-hidden #controls{ opacity:0; transform:translateY(8px); pointer-events:none; }

  /* ---------------------------------------------------------------------
     SWIPE HINT — shown once on first visit to teach the tap/swipe gesture
     --------------------------------------------------------------------- */
  #swipeHint{
    position:absolute; left:50%; bottom:104px; z-index:15;
    transform:translateX(-50%) translateY(6px);
    display:flex; align-items:center; gap:8px;
    padding:9px 16px; border-radius:999px;
    background:rgba(255,255,255,0.85);
    border:1px solid rgba(150,116,47,0.22);
    box-shadow:var(--shadow-soft);
    font-size:12px; color:var(--ink-dim); letter-spacing:.02em;
    opacity:0; pointer-events:none;
    transition:opacity .5s var(--ease), transform .5s var(--ease);
  }
  #swipeHint.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #swipeHint svg{ width:14px; height:14px; color:var(--brass-deep); animation:hintSlide 1.6s ease-in-out infinite; }
  @keyframes hintSlide{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(4px);} }

  /* ---------------------------------------------------------------------
     Progress dots (mobile-friendly alt indicator) — optional, subtle
     --------------------------------------------------------------------- */
  @media (max-width:640px){
    #brandBar{ padding:16px 16px 30px; }
    #brandBar .titles .t{ font-size:16px; }
    #viewer{ padding:10px 8px; }
    #controls{ padding:16px 10px 18px; }
    #controlsBar button{ width:38px; height:38px; }
    #zoomLabel{ display:none; }
  }

  /* Respect reduced motion */
  @media (prefers-reduced-motion: reduce){
    .page-layer, #brandBar, #controls, #loadingScreen{ transition:none !important; }
  }

  /* Fullscreen tweaks */
  #app:fullscreen{ background:var(--bg); }
</style>
</head>
<body>

<div id="app">

  <!-- Brand / title bar -->
  <header id="brandBar">
    <img id="brandLogo" src="" alt="" style="display:none;">
    <div class="titles">
      <div class="t" id="brandTitle">Menu</div>
      <div class="s" id="brandSubtitle"></div>
    </div>
  </header>

  <!-- Main viewing stage -->
  <main id="viewer">
    <div id="pageStage" aria-label="Menu page. Tap left to go back, tap right to go forward.">
      <img class="page-layer" id="layerA" alt="Menu page">
      <img class="page-layer" id="layerB" alt="Menu page">
    </div>
  </main>

  <!-- Loading -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="brand-name" id="loadingBrand">Menu</div>
    <div class="label">Loading pages…</div>
  </div>

  <!-- Error -->
  <div id="errorScreen">
    <h2>Couldn't load the menu</h2>
    <p id="errorMessage">Please check the PDF source and try again.</p>
    <button id="errorRetryBtn" type="button">Try again</button>
  </div>

  <!-- One-time swipe/tap hint -->
  <div id="swipeHint" aria-hidden="true">
    <span>Swipe or tap to browse</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
  </div>

  <!-- Controls -->
  <footer id="controls">
    <div id="controlsBar">
      <button id="zoomOutBtn" title="Zoom out" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <div id="zoomLabel">100%</div>
      <button id="zoomInBtn" title="Zoom in" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>

      <div class="ctrl-divider"></div>

      <button id="prevBtn" title="Previous page" aria-label="Previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div id="pageIndicator"><b id="curPage">1</b>&nbsp;/&nbsp;<span id="totalPages">1</span></div>
      <button id="nextBtn" title="Next page" aria-label="Next page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <div class="ctrl-divider"></div>

      <a id="downloadBtn" title="Save menu as PDF" aria-label="Download menu PDF" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </a>
      <button id="fullscreenBtn" title="Fullscreen" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </footer>

</div>

<!-- PDF.js (rendering engine) — loaded from cdnjs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
(function(){
  'use strict';

  /* =========================================================================
     CONFIGURATION — this is the only section you should need to touch.
     ========================================================================= */
  const CONFIG = {
    // Path or URL to the menu PDF. Swap this to point at your own file
    // (e.g. "menu.pdf" placed next to this HTML file, or any https URL
    // that allows cross-origin fetch).
    pdfUrl: 'menu.pdf',

    // Brand bar text
    title: '',
    subtitle: '',

    // Optional logo image shown next to the title. Leave as '' to hide.
    logoUrl: '',

    // Which page to open on
    initialPage: 1,

    // Max device-pixel-ratio used for rendering (higher = crisper but slower)
    maxRenderScale: 2.5,

    // Idle time (ms) before controls auto-hide
    idleTimeout: 3200,

    // Zoom bounds & step (applied as a CSS transform on the current page)
    zoomMin: 1,
    zoomMax: 2.2,
    zoomStep: 0.25,
  };

  /* =========================================================================
     STATE
     ========================================================================= */
  let pdfDoc = null;
  let totalPages = 0;
  let currentPage = CONFIG.initialPage;
  let activeLayer = 'A';           // which <img> is currently visible
  let zoom = 1;
  let isAnimating = false;
  let idleTimer = null;
  let renderCache = new Map();     // pageNum -> dataURL string
  let renderPromises = new Map();  // pageNum -> in-flight Promise<string>
  let pointerStart = null;

  /* =========================================================================
     DOM REFS
     ========================================================================= */
  const app = document.getElementById('app');
  const stage = document.getElementById('pageStage');
  const layerA = document.getElementById('layerA');
  const layerB = document.getElementById('layerB');
  const loadingScreen = document.getElementById('loadingScreen');
  const errorScreen = document.getElementById('errorScreen');
  const errorMessage = document.getElementById('errorMessage');
  const curPageEl = document.getElementById('curPage');
  const totalPagesEl = document.getElementById('totalPages');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomLabel = document.getElementById('zoomLabel');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const errorRetryBtn = document.getElementById('errorRetryBtn');
  const swipeHint = document.getElementById('swipeHint');

  /* =========================================================================
     BRANDING APPLY
     ========================================================================= */
  function applyBranding(){
    document.title = CONFIG.title;
    document.getElementById('brandTitle').textContent = CONFIG.title;
    document.getElementById('brandSubtitle').textContent = CONFIG.subtitle;
    document.getElementById('loadingBrand').textContent = CONFIG.title;
    if (CONFIG.logoUrl) {
      const logo = document.getElementById('brandLogo');
      logo.src = CONFIG.logoUrl;
      logo.style.display = 'block';
    }
  }

  /* =========================================================================
     PDF LOADING
     ========================================================================= */
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  async function loadPdf(){
    errorScreen.classList.remove('show');
    loadingScreen.classList.remove('hidden');
    downloadBtn.href = CONFIG.pdfUrl;

    try{
      const loadingTask = pdfjsLib.getDocument({ url: CONFIG.pdfUrl });
      pdfDoc = await loadingTask.promise;
      totalPages = pdfDoc.numPages;
      totalPagesEl.textContent = totalPages;
      currentPage = Math.min(Math.max(CONFIG.initialPage, 1), totalPages);

      const firstDataUrl = await getRenderedPage(currentPage);
      layerA.src = firstDataUrl;
      layerA.classList.add('active');
      updateIndicator();
      updateNavButtons();

      loadingScreen.classList.add('hidden');
      preloadNeighbors(currentPage);
      scheduleIdle();
      maybeShowSwipeHint();
    }catch(err){
      console.error('Failed to load PDF:', err);
      loadingScreen.classList.add('hidden');
      errorMessage.textContent = 'The menu could not be loaded from: ' + CONFIG.pdfUrl;
      errorScreen.classList.add('show');
    }
  }

  errorRetryBtn.addEventListener('click', loadPdf);

  /* =========================================================================
     SWIPE HINT — shown once per browser (localStorage flag) after the
     first page renders, so first-time visitors know the page is navigable.
     ========================================================================= */
  function maybeShowSwipeHint(){
    if (totalPages <= 1) return;
    let alreadySeen = false;
    try { alreadySeen = localStorage.getItem('munaMenuHintSeen') === '1'; } catch(e){}
    if (alreadySeen) return;

    setTimeout(() => swipeHint.classList.add('show'), 500);
    setTimeout(() => dismissSwipeHint(), 4500);
  }
  function dismissSwipeHint(){
    swipeHint.classList.remove('show');
    try { localStorage.setItem('munaMenuHintSeen', '1'); } catch(e){}
  }

  /* =========================================================================
     RENDERING — each page is rasterized once at a "fit" scale (times device
     pixel ratio for crispness) and cached as a data URL. Cache is cleared on
     resize since the fit scale changes.
     ========================================================================= */
  function computeAvailableBox(){
    const rect = stage.getBoundingClientRect();
    return { w: rect.width, h: rect.height };
  }

  async function renderPageToDataUrl(pageNum){
    const page = await pdfDoc.getPage(pageNum);
    const baseViewport = page.getViewport({ scale: 1 });
    const box = computeAvailableBox();

    const fitScale = Math.min(box.w / baseViewport.width, box.h / baseViewport.height);
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxRenderScale);
    const renderScale = Math.max(fitScale, 0.1) * dpr;

    const viewport = page.getViewport({ scale: renderScale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d');

    await page.render({ canvasContext: ctx, viewport }).promise;
    return canvas.toDataURL('image/jpeg', 0.92);
  }

  function getRenderedPage(pageNum){
    if (renderCache.has(pageNum)) return Promise.resolve(renderCache.get(pageNum));
    if (renderPromises.has(pageNum)) return renderPromises.get(pageNum);

    const p = renderPageToDataUrl(pageNum).then(dataUrl => {
      renderCache.set(pageNum, dataUrl);
      renderPromises.delete(pageNum);
      return dataUrl;
    }).catch(err => {
      renderPromises.delete(pageNum);
      throw err;
    });
    renderPromises.set(pageNum, p);
    return p;
  }

  function preloadNeighbors(pageNum){
    [pageNum - 1, pageNum + 1, pageNum + 2].forEach(n => {
      if (n >= 1 && n <= totalPages && !renderCache.has(n)) {
        getRenderedPage(n).catch(() => {});
      }
    });
  }

  /* =========================================================================
     NAVIGATION — cross-fades between two stacked <img> layers
     ========================================================================= */
  async function showPage(num){
    if (num < 1 || num > totalPages || num === currentPage || isAnimating) return;
    isAnimating = true;

    try {
      const dataUrl = await getRenderedPage(num);
      const incoming = activeLayer === 'A' ? layerB : layerA;
      const outgoing = activeLayer === 'A' ? layerA : layerB;

      incoming.src = dataUrl;
      incoming.style.setProperty('--zoom', 1);
      incoming.classList.remove('zoomed');
      zoom = 1;
      updateZoomLabel();

      // Force layout so the transition triggers cleanly
      // eslint-disable-next-line no-unused-expressions
      incoming.offsetHeight;

      incoming.classList.add('active');
      outgoing.classList.remove('active');

      activeLayer = activeLayer === 'A' ? 'B' : 'A';
      currentPage = num;
      updateIndicator();
      updateNavButtons();
      preloadNeighbors(num);
    } finally {
      setTimeout(() => { isAnimating = false; }, 400);
    }
  }

  function nextPage(){ showPage(currentPage + 1); }
  function prevPage(){ showPage(currentPage - 1); }

  function updateIndicator(){
    curPageEl.textContent = currentPage;
  }
  function updateNavButtons(){
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;
  }

  /* =========================================================================
     ZOOM — applied as a CSS transform on the visible layer (no re-render)
     ========================================================================= */
  function applyZoom(){
    const active = activeLayer === 'A' ? layerA : layerB;
    active.style.setProperty('--zoom', zoom);
    active.classList.toggle('zoomed', zoom !== 1);
    updateZoomLabel();
  }
  function updateZoomLabel(){
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
  }
  function zoomIn(){
    zoom = Math.min(CONFIG.zoomMax, +(zoom + CONFIG.zoomStep).toFixed(2));
    applyZoom();
  }
  function zoomOut(){
    zoom = Math.max(CONFIG.zoomMin, +(zoom - CONFIG.zoomStep).toFixed(2));
    applyZoom();
  }

  /* =========================================================================
     TAP / SWIPE — a single pointer-event flow drives both click-to-turn
     and swipe-to-turn, so there's no risk of double-firing on touch devices.
     ========================================================================= */
  const TAP_MOVE_THRESHOLD = 10;   // px — below this, treat as a tap
  const SWIPE_THRESHOLD = 48;      // px — above this horizontal delta, treat as swipe

  stage.addEventListener('pointerdown', (e) => {
    pointerStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  });

  stage.addEventListener('pointerup', (e) => {
    if (!pointerStart) return;
    const dx = e.clientX - pointerStart.x;
    const dy = e.clientY - pointerStart.y;
    const absDx = Math.abs(dx), absDy = Math.abs(dy);
    pointerStart = null;
    wakeChrome();

    if (absDx > SWIPE_THRESHOLD && absDx > absDy) {
      // Swipe: left → next, right → previous
      dx < 0 ? nextPage() : prevPage();
      return;
    }
    if (absDx < TAP_MOVE_THRESHOLD && absDy < TAP_MOVE_THRESHOLD) {
      // Tap: left third → previous, rest → next
      const rect = stage.getBoundingClientRect();
      const relX = e.clientX - rect.left;
      relX < rect.width * 0.3 ? prevPage() : nextPage();
    }
  });

  stage.addEventListener('pointermove', (e) => {
    if (!pointerStart) {
      const rect = stage.getBoundingClientRect();
      const relX = e.clientX - rect.left;
      stage.classList.toggle('hint-left', relX < rect.width * 0.3);
    }
  });
  stage.addEventListener('pointerleave', () => stage.classList.remove('hint-left'));

  /* =========================================================================
     BUTTONS / KEYBOARD
     ========================================================================= */
  prevBtn.addEventListener('click', () => { prevPage(); wakeChrome(); });
  nextBtn.addEventListener('click', () => { nextPage(); wakeChrome(); });
  zoomInBtn.addEventListener('click', () => { zoomIn(); wakeChrome(); });
  zoomOutBtn.addEventListener('click', () => { zoomOut(); wakeChrome(); });
  fullscreenBtn.addEventListener('click', () => { toggleFullscreen(); wakeChrome(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextPage();
    else if (e.key === 'ArrowLeft') prevPage();
    else if (e.key === '+') zoomIn();
    else if (e.key === '-') zoomOut();
    else if (e.key.toLowerCase() === 'f') toggleFullscreen();
    wakeChrome();
  });

  function toggleFullscreen(){
    if (!document.fullscreenElement) {
      app.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.();
    }
  }

  /* =========================================================================
     AUTO-HIDE CHROME ON IDLE
     ========================================================================= */
  function scheduleIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => app.classList.add('chrome-hidden'), CONFIG.idleTimeout);
  }
  function wakeChrome(){
    app.classList.remove('chrome-hidden');
    scheduleIdle();
    dismissSwipeHint();
  }
  ['pointerdown', 'pointermove', 'wheel'].forEach(evt =>
    app.addEventListener(evt, wakeChrome, { passive: true })
  );

  /* =========================================================================
     RESIZE — the fit scale changes with viewport size, so cached renders
     are invalidated and the current page is redrawn crisp at the new size.
     ========================================================================= */
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      renderCache.clear();
      const active = activeLayer === 'A' ? layerA : layerB;
      getRenderedPage(currentPage).then(dataUrl => { active.src = dataUrl; });
      preloadNeighbors(currentPage);
    }, 300);
  });

  /* =========================================================================
     INIT
     ========================================================================= */
  applyBranding();
  loadPdf();

})();
</script>
</body>
